name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MABAT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # Pinned: the compile error snapshots in crates/mabat/tests/ui depend on the
      # compiler version. Bless them again (TRYBUILD=overwrite) when moving the pin.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # PostgreSQL and SQLite: the E2E crate enables SQLite for the whole workspace
      - run: cargo test --workspace
      # Each database on its own, and none
      - run: cargo clippy -p mabat --no-default-features --features sqlite --all-targets -- -D warnings
      - run: cargo test -p mabat --no-default-features --features sqlite
      - run: cargo build -p mabat-cli --no-default-features --features sqlite
      - run: cargo test -p mabat
      - run: cargo check -p mabat --no-default-features
      - run: cargo publish --workspace --dry-run

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The minimum supported Rust version, rust-version in Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
