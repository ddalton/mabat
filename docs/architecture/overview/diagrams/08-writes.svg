<svg xmlns='http://www.w3.org/2000/svg' width='1637' height='625' viewBox='0 0 1637 625'><defs><marker id='ah-4B8B2B' markerWidth='8' markerHeight='6' refX='7.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#4B8B2B'/></marker><marker id='ahs-4B8B2B' markerWidth='8' markerHeight='6' refX='0.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M8,0 L0,3 L8,6 z' fill='#4B8B2B'/></marker><marker id='ah-6F45B5' markerWidth='8' markerHeight='6' refX='7.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#6F45B5'/></marker><marker id='ahs-6F45B5' markerWidth='8' markerHeight='6' refX='0.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M8,0 L0,3 L8,6 z' fill='#6F45B5'/></marker><marker id='ah-C0392B' markerWidth='8' markerHeight='6' refX='7.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#C0392B'/></marker><marker id='ahs-C0392B' markerWidth='8' markerHeight='6' refX='0.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M8,0 L0,3 L8,6 z' fill='#C0392B'/></marker></defs><rect x='0' y='0' width='1636.8' height='625.0' fill='#FFFFFF'/><rect x='24.00' y='28.80' width='499.20' height='38.40' rx='4.80' fill='#2E6FB7' stroke='#2E6FB7' stroke-width='1.00'/><text xml:space='preserve' x='273.60' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>mabat::save(&amp;mut board, &amp;mut tx)</text><rect x='566.40' y='28.80' width='499.20' height='38.40' rx='4.80' fill='#17847A' stroke='#17847A' stroke-width='1.00'/><text xml:space='preserve' x='816.00' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>the statements, in one transaction</text><rect x='1108.80' y='28.80' width='499.20' height='38.40' rx='4.80' fill='#4338CA' stroke='#4338CA' stroke-width='1.00'/><text xml:space='preserve' x='1358.40' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>with #[view(version)]</text><path d='M24.00,91.20 L523.20,91.20 L523.20,143.61 L24.00,143.61 Z' fill='#E6DBF6' stroke='#6F45B5' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='273.60' y='115.58' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='middle' font-weight='600'>Board  ·  the board row</text><text xml:space='preserve' x='273.60' y='128.61' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#3D4650' text-anchor='middle'>name, owner_id (the reference's key only), the state tag and its variant's columns, color_red …</text><path d='M81.60,172.41 L523.20,172.41 L523.20,223.82 L81.60,223.82 Z' fill='#E6DBF6' stroke='#6F45B5' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='302.40' y='196.26' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#101010' text-anchor='middle' font-weight='600'>lists  ·  Vec, index = "position"</text><text xml:space='preserve' x='302.40' y='208.89' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>list rows with board_id and their position from 0; each list owns its cards</text><polyline points='52.80,143.61 52.80,198.11 81.60,198.11' fill='none' stroke='#6F45B5' stroke-width='1.34' marker-end='url(#ah-6F45B5)' /><path d='M81.60,238.22 L523.20,238.22 L523.20,289.63 L81.60,289.63 Z' fill='#E6DBF6' stroke='#6F45B5' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='302.40' y='262.07' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#101010' text-anchor='middle' font-weight='600'>labels  ·  many-to-many</text><text xml:space='preserve' x='302.40' y='274.71' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>board_label link rows only; labels are not written</text><polyline points='52.80,143.61 52.80,263.93 81.60,263.93' fill='none' stroke='#6F45B5' stroke-width='1.34' marker-end='url(#ah-6F45B5)' /><path d='M81.60,304.03 L523.20,304.03 L523.20,355.45 L81.60,355.45 Z' fill='#E6DBF6' stroke='#6F45B5' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='302.40' y='327.89' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#101010' text-anchor='middle' font-weight='600'>settings  ·  BTreeMap by name</text><text xml:space='preserve' x='302.40' y='340.52' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>setting rows with board_id and their map key</text><polyline points='52.80,143.61 52.80,329.74 81.60,329.74' fill='none' stroke='#6F45B5' stroke-width='1.34' marker-end='url(#ah-6F45B5)' /><path d='M81.60,369.85 L523.20,369.85 L523.20,421.26 L81.60,421.26 Z' fill='#E6DBF6' stroke='#6F45B5' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='302.40' y='393.70' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#101010' text-anchor='middle' font-weight='600'>visibility  ·  a table per variant</text><text xml:space='preserve' x='302.40' y='406.33' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>the public_board row, or none</text><polyline points='52.80,143.61 52.80,395.55 81.60,395.55' fill='none' stroke='#6F45B5' stroke-width='1.34' marker-end='url(#ah-6F45B5)' /><text xml:space='preserve' x='28.32' y='454.62' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='start'>the encoder the derive generated builds this tree of rows, a RowWrite per row</text><rect x='566.40' y='91.20' width='499.20' height='45.32' rx='5.76' fill='#FCE3CD' stroke='#C0651A' stroke-width='1.15'/><text xml:space='preserve' x='570.72' y='106.15' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.20' fill='#101010' text-anchor='start' font-weight='600'>1  SAVEPOINT, or BEGIN</text><text xml:space='preserve' x='570.72' y='118.72' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>your transaction, or one of its own (MPA-WRITE-1)</text><rect x='566.40' y='146.12' width='499.20' height='57.56' rx='5.76' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15'/><text xml:space='preserve' x='570.72' y='161.07' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.20' fill='#101010' text-anchor='start' font-weight='600'>2  UPDATE board SET … WHERE id = $n</text><text xml:space='preserve' x='570.72' y='173.64' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>and only if no row has the key, the upsert: ON CONFLICT (id) DO UPDATE, or ON DUPLICATE KEY UPDATE</text><text xml:space='preserve' x='570.72' y='185.87' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>on MySQL (MPA-WRITE-3)</text><rect x='566.40' y='213.28' width='499.20' height='45.32' rx='5.76' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15'/><text xml:space='preserve' x='570.72' y='228.23' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.20' fill='#101010' text-anchor='start' font-weight='600'>3  SELECT id FROM list WHERE board_id = ANY($1)</text><text xml:space='preserve' x='570.72' y='240.80' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>the rows the collection has in the database</text><rect x='566.40' y='268.20' width='499.20' height='45.32' rx='5.76' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15'/><text xml:space='preserve' x='570.72' y='283.15' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.20' fill='#101010' text-anchor='start' font-weight='600'>4  DELETE the lists that are gone</text><text xml:space='preserve' x='570.72' y='295.72' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>with their cards first: deepest first (MPA-WRITE-4)</text><rect x='566.40' y='323.13' width='499.20' height='45.32' rx='5.76' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15'/><text xml:space='preserve' x='570.72' y='338.08' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.20' fill='#101010' text-anchor='start' font-weight='600'>5  save the other lists, then their cards</text><text xml:space='preserve' x='570.72' y='350.64' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>with board_id and position</text><rect x='566.40' y='378.05' width='499.20' height='45.32' rx='5.76' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15'/><text xml:space='preserve' x='570.72' y='393.00' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.20' fill='#101010' text-anchor='start' font-weight='600'>6  replace the board_label links</text><text xml:space='preserve' x='570.72' y='405.56' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>delete and insert the link rows (MPA-WRITE-5)</text><rect x='566.40' y='432.97' width='499.20' height='45.32' rx='5.76' fill='#FCE3CD' stroke='#C0651A' stroke-width='1.15'/><text xml:space='preserve' x='570.72' y='447.92' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.20' fill='#101010' text-anchor='start' font-weight='600'>7  RELEASE, or COMMIT</text><text xml:space='preserve' x='570.72' y='460.49' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>statements ran as they were called: nothing waits for a flush</text><path d='M1108.80,91.20 L1608.00,91.20 L1608.00,143.27 L1108.80,143.27 Z' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1358.40' y='115.05' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#101010' text-anchor='middle' font-weight='600'>UPDATE board SET …, version = version + 1</text><text xml:space='preserve' x='1358.40' y='128.22' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>WHERE id = $1 AND version = $2: the version it was loaded with</text><path d='M1108.80,196.07 L1344.00,196.07 L1344.00,247.49 L1108.80,247.49 Z' fill='#E8F5EC' stroke='#2F7D4A' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1226.40' y='219.93' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#101010' text-anchor='middle' font-weight='600'>one row</text><text xml:space='preserve' x='1226.40' y='232.56' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>saved; the version incremented</text><path d='M1372.80,196.07 L1608.00,196.07 L1608.00,247.49 L1372.80,247.49 Z' fill='#F6F7F9' stroke='#5B6472' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1490.40' y='219.93' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#101010' text-anchor='middle' font-weight='600'>no row</text><text xml:space='preserve' x='1490.40' y='232.56' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>insert it, unless a row has its key</text><polyline points='1226.40,143.27 1226.40,196.07' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /><polyline points='1490.40,143.27 1490.40,196.07' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /><path d='M1108.80,300.29 L1344.00,300.29 L1344.00,363.94 L1108.80,363.94 Z' fill='#E8F5EC' stroke='#2F7D4A' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1226.40' y='330.26' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#101010' text-anchor='middle' font-weight='600'>inserted</text><text xml:space='preserve' x='1226.40' y='342.89' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>a new board</text><path d='M1372.80,300.29 L1608.00,300.29 L1608.00,363.94 L1372.80,363.94 Z' fill='#FDECEC' stroke='#C0392B' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1490.40' y='324.14' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#101010' text-anchor='middle' font-weight='600'>Error::Conflict</text><text xml:space='preserve' x='1490.40' y='336.77' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#8C2F22' text-anchor='middle'>someone changed or deleted it; the</text><text xml:space='preserve' x='1490.40' y='349.01' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#8C2F22' text-anchor='middle'>transaction is rolled back</text><polyline points='1420.80,247.49 1420.80,273.41 1226.40,273.41 1226.40,300.29' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /><polyline points='1519.20,247.49 1519.20,300.29' fill='none' stroke='#C0392B' stroke-width='1.34' marker-end='url(#ah-C0392B)' /><rect x='1108.80' y='392.74' width='499.20' height='72.37' rx='5.76' fill='#F6F7F9' stroke='#5B6472' stroke-width='1.15'/><text xml:space='preserve' x='1113.12' y='408.22' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.73' fill='#101010' text-anchor='start' font-weight='600'>the insert, if absent</text><text xml:space='preserve' x='1113.12' y='420.91' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>INSERT … ON CONFLICT (id) DO NOTHING</text><text xml:space='preserve' x='1113.12' y='433.15' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>on MySQL, which counts a found row as affected,</text><text xml:space='preserve' x='1113.12' y='445.38' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>INSERT … SELECT … WHERE NOT EXISTS (MPA-WRITE-9)</text><rect x='1108.80' y='476.63' width='499.20' height='60.14' rx='5.76' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='1.15'/><text xml:space='preserve' x='1113.12' y='492.11' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.73' fill='#101010' text-anchor='start' font-weight='600'>written back</text><text xml:space='preserve' x='1113.12' y='504.81' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>the new versions go into the value and the elements of its owned collections, so it can be saved</text><text xml:space='preserve' x='1113.12' y='517.04' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>again without reloading (MPA-WRITE-10)</text><rect x='1108.80' y='548.29' width='499.20' height='47.90' rx='5.76' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15'/><text xml:space='preserve' x='1113.12' y='563.77' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.73' fill='#101010' text-anchor='start' font-weight='600'>delete::&lt;Board, _&gt;(id, tx)</text><text xml:space='preserve' x='1113.12' y='576.47' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#333333' text-anchor='start'>the row and everything it owns, deepest first; returns whether it existed (MPA-WRITE-7)</text></svg>