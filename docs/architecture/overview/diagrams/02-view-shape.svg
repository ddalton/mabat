ial, sans-serif" font-size='11.73' fill='#101010' text-anchor='middle' font-weight='600'>a decoder per database</text><text xml:space='preserve' x='1041.96' y='573.77' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#3D4650' text-anchor='middle'>rows to values, by alias</text><path d='M1164.96,536.69 L1378.32,536.69 L1378.32,588.77 L1164.96,588.77 Z' fill='#E6DBF6' stroke='#6F45B5' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1271.64' y='560.81' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.73' fill='#101010' text-anchor='middle' font-weight='600'>an encoder per database</text><text xml:space='preserve' x='1271.64' y='573.77' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#3D4650' text-anchor='middle'>values to rows, for save</text><path d='M1394.64,536.69 L1608.00,536.69 L1608.00,588.77 L1394.64,588.77 Z' fill='#E6DBF6' stroke='#6F45B5' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1501.32' y='560.81' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.73' fill='#101010' text-anchor='middle' font-weight='600'>a comparison</text><text xml:space='preserve' x='1501.32' y='573.77' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#3D4650' text-anchor='middle'>what changed, for save_changes</text></svg>