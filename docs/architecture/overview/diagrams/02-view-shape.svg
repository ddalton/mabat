<svg xmlns='http://www.w3.org/2000/svg' width='1637' height='618' viewBox='0 0 1637 618'><defs><marker id='ah-B0862A' markerWidth='8' markerHeight='6' refX='7.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#B0862A'/></marker><marker id='ahs-B0862A' markerWidth='8' markerHeight='6' refX='0.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M8,0 L0,3 L8,6 z' fill='#B0862A'/></marker></defs><rect x='0' y='0' width='1636.8' height='617.6' fill='#FFFFFF'/><rect x='24.00' y='28.80' width='633.60' height='38.40' rx='4.80' fill='#2E6FB7' stroke='#2E6FB7' stroke-width='1.00'/><text xml:space='preserve' x='340.80' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>the declaration</text><rect x='24.00' y='81.60' width='633.60' height='394.65' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='39.84' y='104.49' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>#[derive(View)]</text><text xml:space='preserve' x='39.84' y='118.71' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>#[view(table = "task")]</text><text xml:space='preserve' x='39.84' y='132.93' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>struct TaskView {</text><text xml:space='preserve' x='39.84' y='147.15' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    id: Uuid,                     // the key</text><text xml:space='preserve' x='39.84' y='161.37' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    name: String,</text><text xml:space='preserve' x='39.84' y='175.59' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    #[view(json)]</text><text xml:space='preserve' x='39.84' y='189.81' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    labels: Vec&lt;String&gt;,</text><text xml:space='preserve' x='39.84' y='204.03' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    #[view(embed(prefix = "due_"))]</text><text xml:space='preserve' x='39.84' y='218.24' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    due: Window,                 // due_start, due_end</text><text xml:space='preserve' x='39.84' y='232.46' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    #[view(embed)]</text><text xml:space='preserve' x='39.84' y='246.68' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    state: State,                // an enum with data</text><text xml:space='preserve' x='39.84' y='260.90' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    #[view(to_one(fk = "assignee_id"))]</text><text xml:space='preserve' x='39.84' y='275.12' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    assignee: Option&lt;PersonView&gt;,</text><text xml:space='preserve' x='39.84' y='289.34' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    #[view(child(fk = "task_id", order_by = "created_at"))]</text><text xml:space='preserve' x='39.84' y='303.56' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    notes: Vec&lt;NoteView&gt;,</text><text xml:space='preserve' x='39.84' y='317.77' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    #[view(child(fk = "parent_id", depth = 2))]</text><text xml:space='preserve' x='39.84' y='331.99' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>    children: Vec&lt;TaskView&gt;,</text><text xml:space='preserve' x='39.84' y='346.21' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>}</text><text xml:space='preserve' x='39.84' y='374.65' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>#[derive(View)]</text><text xml:space='preserve' x='39.84' y='388.87' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>#[view(embedded)]</text><text xml:space='preserve' x='39.84' y='403.09' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>struct Window { start: NaiveDate, end: Option&lt;NaiveDate&gt; }</text><text xml:space='preserve' x='39.84' y='431.52' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>#[derive(View)]</text><text xml:space='preserve' x='39.84' y='445.74' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>#[view(tag = "state")]</text><text xml:space='preserve' x='39.84' y='459.96' font-family="Consolas, Menlo, monospace" font-size='11.47' fill='#14181D' text-anchor='start'>enum State { Open, Blocked { reason: String }, Done }</text><rect x='705.60' y='28.80' width='902.40' height='38.40' rx='4.80' fill='#6F45B5' stroke='#6F45B5' stroke-width='1.00'/><text xml:space='preserve' x='1156.80' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>the shape the derive generates, and how it loads</text><rect x='705.60' y='91.20' width='902.40' height='235.20' rx='13.44' fill='#FCFDFE' stroke='#A9B2BD' stroke-width='0.86' stroke-dasharray='6 4'/><text xml:space='preserve' x='727.20' y='120.09' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.67' fill='#5A646F' text-anchor='start' font-weight='600'>one row of task, in the $root query</text><text xml:space='preserve' x='727.20' y='137.73' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#6B7683' text-anchor='start'>decoded by alias; each path is the alias of its column (MPA-CORE-4, MPA-PLAN-2)</text><path d='M729.60,172.80 L936.00,172.80 L936.00,297.60 L729.60,297.60 Z' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='832.80' y='214.07' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>columns</text><text xml:space='preserve' x='832.80' y='227.50' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>id  ·  name</text><text xml:space='preserve' x='832.80' y='253.29' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>labels: a JSON column, read with</text><text xml:space='preserve' x='832.80' y='266.18' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>serde (MPA-VIEW-6)</text><path d='M952.32,172.80 L1158.72,172.80 L1158.72,297.60 L952.32,297.60 Z' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1055.52' y='214.07' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>an embedded struct</text><text xml:space='preserve' x='1055.52' y='227.50' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>due.start  ·  due.end</text><text xml:space='preserve' x='1055.52' y='253.29' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>in columns due_start and due_end of</text><text xml:space='preserve' x='1055.52' y='266.18' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>the same row (MPA-VIEW-7)</text><path d='M1175.04,172.80 L1381.44,172.80 L1381.44,297.60 L1175.04,297.60 Z' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1278.24' y='207.62' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>an enum with data</text><text xml:space='preserve' x='1278.24' y='221.05' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>state.$tag names the variant</text><text xml:space='preserve' x='1278.24' y='246.84' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>state.Blocked.reason is a column of</text><text xml:space='preserve' x='1278.24' y='259.74' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>the row; decoding is strict</text><text xml:space='preserve' x='1278.24' y='272.63' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>(MPA-SUM-4)</text><path d='M1397.76,172.80 L1604.16,172.80 L1604.16,297.60 L1397.76,297.60 Z' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1500.96' y='220.52' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>a reference's key</text><text xml:space='preserve' x='1500.96' y='233.94' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>$ref.assignee: the foreign key</text><text xml:space='preserve' x='1500.96' y='246.84' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>assignee_id, whose rows the assignee</text><text xml:space='preserve' x='1500.96' y='259.74' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>query fetches</text><path d='M705.60,398.40 L988.80,398.40 L988.80,464.69 L705.60,464.69 Z' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='847.20' y='423.31' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>assignee  ·  a to-one reference</text><text xml:space='preserve' x='847.20' y='436.74' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>PersonView rows WHERE id IN the $ref.assignee keys;</text><text xml:space='preserve' x='847.20' y='449.63' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>a NULL key is None (MPA-VIEW-8)</text><path d='M1015.20,398.40 L1298.40,398.40 L1298.40,464.69 L1015.20,464.69 Z' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1156.80' y='423.31' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>notes  ·  a collection</text><text xml:space='preserve' x='1156.80' y='436.74' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>NoteView rows WHERE task_id IN the tasks' keys,</text><text xml:space='preserve' x='1156.80' y='449.63' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>ordered by created_at, then the key (MPA-VIEW-9)</text><path d='M1324.80,398.40 L1608.00,398.40 L1608.00,464.69 L1324.80,464.69 Z' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1466.40' y='423.31' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>children  ·  recursive, depth 2</text><text xml:space='pre