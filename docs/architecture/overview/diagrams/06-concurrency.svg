' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.67' fill='#14181D' text-anchor='start'>a connection, a transaction or a pooled connection: every query on it, in turn</text><rect x='561.60' y='513.60' width='508.80' height='55.97' rx='3.84' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='565.92' y='527.23' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#6B7683' text-anchor='start' font-weight='600'>THE CONNECTION GIVEN</text><text xml:space='preserve' x='565.92' y='540.26' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.67' fill='#14181D' text-anchor='start'>Pooled::snapshot(&amp;pool, n): PostgreSQL only — asking for it on MySQL or SQLite does not</text><text xml:space='preserve' x='565.92' y='553.48' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.67' fill='#14181D' text-anchor='start'>compile</text><rect x='1099.20' y='513.60' width='508.80' height='55.97' rx='3.84' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='1103.52' y='527.23' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#6B7683' text-anchor='start' font-weight='600'>THE CONNECTION GIVEN</text><text xml:space='preserve' x='1103.52' y='540.26' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.67' fill='#14181D' text-anchor='start'>Pooled::read_committed(&amp;pool, n): any database; each query sees what is committed when it</text><text xml:space='preserve' x='1103.52' y='553.48' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.67' fill='#14181D' text-anchor='start'>runs</text><rect x='24.00' y='577.25' width='508.80' height='42.74' rx='3.84' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='28.32' y='590.88' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#6B7683' text-anchor='start' font-weight='600'>CONNECTIONS</text><text xml:s