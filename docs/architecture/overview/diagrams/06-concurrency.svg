683' text-anchor='start' font-weight='600'>WHAT THE LOAD SEES</text><text xml:space='preserve' x='565.92' y='654.33' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.67' fill='#14181D' text-anchor='start'>one consistent snapshot for every query of the load</text><rect x='1099.20' y='627.67' width='508.80' height='42.74' rx='3.84' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='1103.52' y='641.30' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#6B7683' text-anchor='start' font-weight='600'>WHAT THE LOAD SEES</text><text xml:space='preserve' x='1103.52' y='654.33' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.67' fill='#14181D' text-anchor='start'>possibly a newer commit in a later level than in an earlier one</text><rect x='24.00' y='678.09' width='508.80' height='55.97' rx='3.84' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='28.32' y='691.72' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#6B7683' text-anchor='start' font-weight='600'>GRAPHS</text><text xml:space='preserve' x='28.32' y='704.75' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.67' fill='#14181D' text-anchor='start'>in turn</text><rect x='561.60' y='678.09' width='508.80' height='55.97' rx='3.84' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='565.92' y='691.72' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#6B7683' text-anchor='start' font-weight='600'>GRAPHS</text><text xml:space='preserve' x='565.92' y='704.75' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.67' fill='#14181D' text-anchor='start'>in turn on one connection: which query reaches an entity first decides where its row comes</text><text xml:space='preserve' x='565.92' y='717.97' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.67' fill='#14181D' text-anc