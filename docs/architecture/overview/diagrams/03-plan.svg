<svg xmlns='http://www.w3.org/2000/svg' width='1637' height='606' viewBox='0 0 1637 606'><defs><marker id='ah-B0862A' markerWidth='8' markerHeight='6' refX='7.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#B0862A'/></marker><marker id='ahs-B0862A' markerWidth='8' markerHeight='6' refX='0.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M8,0 L0,3 L8,6 z' fill='#B0862A'/></marker></defs><rect x='0' y='0' width='1636.8' height='606.1' fill='#FFFFFF'/><rect x='24.00' y='28.80' width='1113.60' height='38.40' rx='4.80' fill='#17847A' stroke='#17847A' stroke-width='1.00'/><text xml:space='preserve' x='580.80' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>the plan of TaskView, as mabat::plan and explain print it  ·  PostgreSQL</text><rect x='24.00' y='91.20' width='537.60' height='32.64' rx='3.84' fill='#17847A' stroke='#17847A' stroke-width='1.00'/><text xml:space='preserve' x='28.32' y='111.79' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#FFFFFF' text-anchor='start' font-weight='600'>$root   the root</text><rect x='24.00' y='123.84' width='537.60' height='82.83' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='39.84' y='144.62' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>SELECT t0."id" AS "id", t0."name" AS "name",</text><text xml:space='preserve' x='39.84' y='156.19' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>       t0."assignee_id" AS "$ref.assignee"</text><text xml:space='preserve' x='39.84' y='167.77' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>FROM "task" AS t0</text><text xml:space='preserve' x='39.84' y='179.34' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>WHERE t0."name" ILIKE $1</text><text xml:space='preserve' x='39.84' y='190.91' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>ORDER BY t0."name" LIMIT 20</text><rect x='24.00' y='259.47' width='537.60' height='32.64' rx='3.84' fill='#17847A' stroke='#17847A' stroke-width='1.00'/><text xml:space='preserve' x='28.32' y='280.05' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#FFFFFF' text-anchor='start' font-weight='600'>assignee   to-one by $ref.assignee</text><rect x='24.00' y='292.11' width='537.60' height='59.68' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='39.84' y='312.89' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>SELECT t0."id" AS "id", t0."name" AS "name"</text><text xml:space='preserve' x='39.84' y='324.46' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>FROM "person" AS t0</text><text xml:space='preserve' x='39.84' y='336.03' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>WHERE t0."id" = ANY($1)</text><rect x='600.00' y='91.20' width='537.60' height='32.64' rx='3.84' fill='#17847A' stroke='#17847A' stroke-width='1.00'/><text xml:space='preserve' x='604.32' y='111.79' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#FFFFFF' text-anchor='start' font-weight='600'>notes   to-many by task_id</text><rect x='600.00' y='123.84' width='537.60' height='82.83' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='615.84' y='144.62' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>SELECT t0."id" AS "id", t0."task_id" AS "$parent",</text><text xml:space='preserve' x='615.84' y='156.19' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>       t0."body" AS "body"</text><text xml:space='preserve' x='615.84' y='167.77' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>FROM "note" AS t0</text><text xml:space='preserve' x='615.84' y='179.34' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>WHERE t0."task_id" = ANY($1)</text><text xml:space='preserve' x='615.84' y='190.91' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>ORDER BY t0."created_at", t0."id"</text><rect x='600.00' y='259.47' width='537.60' height='32.64' rx='3.84' fill='#17847A' stroke='#17847A' stroke-width='1.00'/><text xml:space='preserve' x='604.32' y='280.05' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#FFFFFF' text-anchor='start' font-weight='600'>subtasks   to-many by parent_id</text><rect x='600.00' y='292.11' width='537.60' height='94.40' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='615.84' y='312.89' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>SELECT t0."id" AS "id", t0."parent_id" AS "$parent",</text><text xml:space='preserve' x='615.84' y='324.46' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>       t0."name" AS "name",</text><text xml:space='preserve' x='615.84' y='336.03' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>       t0."assignee_id" AS "$ref.assignee"</text><text xml:space='preserve' x='615.84' y='347.61' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>FROM "task" AS t0</text><text xml:space='preserve' x='615.84' y='359.18' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>WHERE t0."parent_id" = ANY($1)</text><text xml:space='preserve' x='615.84' y='370.75' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>ORDER BY t0."id"</text><rect x='600.00' y='439.31' width='537.60' height='32.64' rx='3.84' fill='#17847A' stroke='#17847A' stroke-width='1.00'/><text xml:space='preserve' x='604.32' y='459.89' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#FFFFFF' text-anchor='start' font-weight='600'>subtasks.assignee   to-one by $ref.assignee</text><rect x='600.00' y='471.95' width='537.60' height='59.68' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='615.84' y='492.73' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>SELECT t0."id" AS "id", t0."name" AS "name"</text><text xml:space='preserve' x='615.84' y='504.30' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>FROM "person" AS t0</text><text xml:space='preserve' x='615.84' y='515.87' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>WHERE t0."id" = ANY($1)</text><polyline points='120.00,206.67 120.00,259.47' fill='none' stroke='#B0862A' stroke-width='1.34' marker-end='url(#ah-B0862A)' /><text xml:space='preserve' x='268.80' y='234.91' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.60' fill='#B0862A' text-anchor='middle' font-weight='600'>the distinct $ref.assignee keys</text><polyline points='561.60,171.84 600.00,171.84' fill='none' stroke='#B0862A' stroke-width='1.34' marker-end='url(#ah-B0862A)' /><polyline points='561.60,177.87 580.80,177.87 580.80,275.79 600.00,275.79' fill='none' stroke='#B0862A' stroke-width='1.34' marker-end='url(#ah-B0862A)' /><text xml:space='preserve' x='489.60' y='234.91' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.60' fill='#B0862A' text-anchor='middle' font-weight='600'>the tasks' keys</text><polyline points='696.00,386.51 696.00,439.31' fill='none' stroke='#B0862A' stroke-width='1.34' marker-end='url(#ah-B0862A)' /><text xml:space='preserve' x='873.60' y='414.75' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.60' fill='#B0862A' text-anchor='middle' font-weight='600'>the $ref.assignee keys of the subtasks</text><rect x='24.00' y='394.99' width='537.60' height='58.55' rx='5.76' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='28.32' y='410.20' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#14181D' text-anchor='start' font-weight='600'>keys flow down, rows flow up</text><text xml:space='preserve' x='28.32' y='423.10' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>each query takes the keys of the rows above it; its rows are grouped by $parent and attached to their</text><text xml:space='preserve' x='28.32' y='435.66' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>parents</text><rect x='24.00' y='463.14' width='537.60' height='58.55' rx='5.76' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='28.32' y='478.35' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#14181D' text-anchor='start' font-weight='600'>one array, or a padded list</text><text xml:space='preserve' x='28.32' y='491.25' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>= ANY($1) on PostgreSQL; IN (?, …) on MySQL and SQLite, padded to a power of two and at most 1,000 keys</text><text xml:space='preserve' x='28.32' y='503.81' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>a statement (MPA-DB-4)</text><rect x='24.00' y='531.29' width='537.60' height='45.98' rx='5.76' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='28.32' y='546.50' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#14181D' text-anchor='start' font-weight='600'>by alias, never by position</text><text xml:space='preserve' x='28.32' y='559.40' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>a query may select its columns in any order, and extra columns are ignored (MPA-PLAN-3)</text><rect x='1176.00' y='28.80' width='432.00' height='38.40' rx='4.80' fill='#2E6FB7' stroke='#2E6FB7' stroke-width='1.00'/><text xml:space='preserve' x='1392.00' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>the view</text><rect x='1176.00' y='91.20' width='432.00' height='163.84' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='1191.84' y='111.98' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>struct TaskView {</text><text xml:space='preserve' x='1191.84' y='123.55' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>    id: Uuid,</text><text xml:space='preserve' x='1191.84' y='135.13' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>    name: String,</text><text xml:space='preserve' x='1191.84' y='146.70' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>    assignee: Option&lt;PersonView&gt;,</text><text xml:space='preserve' x='1191.84' y='158.27' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>    notes: Vec&lt;NoteView&gt;,</text><text xml:space='preserve' x='1191.84' y='169.85' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>    subtasks: Vec&lt;SubtaskView&gt;,</text><text xml:space='preserve' x='1191.84' y='181.42' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>}</text><text xml:space='preserve' x='1191.84' y='192.99' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>struct SubtaskView {</text><text xml:space='preserve' x='1191.84' y='204.57' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>    id: Uuid,</text><text xml:space='preserve' x='1191.84' y='216.14' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>    name: String,</text><text xml:space='preserve' x='1191.84' y='227.71' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>    assignee: Option&lt;PersonView&gt;,</text><text xml:space='preserve' x='1191.84' y='239.29' font-family="Consolas, Menlo, monospace" font-size='9.33' fill='#14181D' text-anchor='start'>}</text><rect x='1176.00' y='283.84' width='432.00' height='27.06' rx='5.76' fill='#FFFFFF' stroke='none' stroke-width='1.00'/><text xml:space='preserve' x='1180.32' y='300.11' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='start' font-weight='600'>20 tasks, 4 subtasks each</text><rect x='1176.00' y='322.42' width='432.00' height='48.57' rx='5.76' fill='#E8F5EC' stroke='#2F7D4A' stroke-width='1.15'/><text xml:space='preserve' x='1180.32' y='338.17' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='start' font-weight='600'>5 queries with Mabat</text><text xml:space='preserve' x='1180.32' y='351.19' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>one per query of the plan, whatever the number of rows (MPA-PLAN-1)</text><rect x='1176.00' y='382.51' width='432.00' height='61.13' rx='5.76' fill='#FDECEC' stroke='#C0392B' stroke-width='1.15'/><text xml:space='preserve' x='1180.32' y='398.25' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='start' font-weight='600'>181 queries, one per row</text><text xml:space='preserve' x='1180.32' y='411.28' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>1 for the tasks, then 20 for assignees, 20 for notes, 20 for subtasks and 80 for</text><text xml:space='preserve' x='1180.32' y='423.84' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>their assignees: the N+1 pattern of lazy loading</text><rect x='1176.00' y='455.16' width='432.00' height='48.57' rx='5.76' fill='#FDECEC' stroke='#C0392B' stroke-width='1.15'/><text xml:space='preserve' x='1180.32' y='470.90' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='start' font-weight='600'>1 query with joins</text><text xml:space='preserve' x='1180.32' y='483.93' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>but notes × subtasks rows per task: every note repeated for every subtask</text></svg>