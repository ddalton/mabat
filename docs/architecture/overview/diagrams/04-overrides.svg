<svg xmlns='http://www.w3.org/2000/svg' width='1637' height='806' viewBox='0 0 1637 806'><defs><marker id='ah-4B8B2B' markerWidth='8' markerHeight='6' refX='7.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#4B8B2B'/></marker><marker id='ahs-4B8B2B' markerWidth='8' markerHeight='6' refX='0.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M8,0 L0,3 L8,6 z' fill='#4B8B2B'/></marker></defs><rect x='0' y='0' width='1636.8' height='805.6' fill='#FFFFFF'/><rect x='24.00' y='28.80' width='499.20' height='38.40' rx='4.80' fill='#4B8B2B' stroke='#4B8B2B' stroke-width='1.00'/><text xml:space='preserve' x='273.60' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>1 · a DBA writes SQL</text><rect x='566.40' y='28.80' width='499.20' height='38.40' rx='4.80' fill='#17847A' stroke='#17847A' stroke-width='1.00'/><text xml:space='preserve' x='816.00' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>2 · build checks every query</text><rect x='1108.80' y='28.80' width='499.20' height='38.40' rx='4.80' fill='#C0651A' stroke='#C0651A' stroke-width='1.00'/><text xml:space='preserve' x='1358.40' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>3 · loads run the registry</text><rect x='24.00' y='91.20' width='499.20' height='144.00' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='39.84' y='112.24' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'># overrides/TaskView.toml</text><text xml:space='preserve' x='39.84' y='124.15' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>[query."notes"]</text><text xml:space='preserve' x='39.84' y='136.05' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>sql = """</text><text xml:space='preserve' x='39.84' y='147.96' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>SELECT n.id, n.task_id AS "$parent", n.body</text><text xml:space='preserve' x='39.84' y='159.86' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>FROM note n</text><text xml:space='preserve' x='39.84' y='171.76' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>JOIN note_visible v ON v.note_id = n.id</text><text xml:space='preserve' x='39.84' y='183.67' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>WHERE n.task_id = ANY(:keys)</text><text xml:space='preserve' x='39.84' y='195.57' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>ORDER BY n.created_at, n.id</text><text xml:space='preserve' x='39.84' y='207.48' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>"""</text><text xml:space='preserve' x='39.84' y='219.38' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>shadow = true</text><rect x='24.00' y='259.20' width='499.20' height='45.98' rx='5.76' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='28.32' y='274.41' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#14181D' text-anchor='start' font-weight='600'>one file per view</text><text xml:space='preserve' x='28.32' y='287.31' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>TaskView.toml, or TaskView.sql with a -- mabat: query notes line before each query (MPA-OVR-2)</text><rect x='24.00' y='314.78' width='499.20' height='45.98' rx='5.76' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='28.32' y='330.00' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#14181D' text-anchor='start' font-weight='600'>any query, by its path</text><text xml:space='preserve' x='28.32' y='342.89' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>$root, assignee, notes, children.notes: the names of the plan (MPA-CORE-5)</text><rect x='24.00' y='370.37' width='499.20' height='45.98' rx='5.76' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='28.32' y='385.58' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#14181D' text-anchor='start' font-weight='600'>the aliases the view decodes</text><text xml:space='preserve' x='28.32' y='398.48' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>its columns, the key, $parent for a collection, $ref.&lt;field&gt; for a reference (MPA-OVR-3)</text><rect x='24.00' y='425.95' width='499.20' height='45.98' rx='5.76' fill='#F6F7F9' stroke='#DCE0E5' stroke-width='0.77'/><text xml:space='preserve' x='28.32' y='441.17' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#14181D' text-anchor='start' font-weight='600'>the keys of the rows above</text><text xml:space='preserve' x='28.32' y='454.06' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>:keys, or $1 on PostgreSQL (MPA-OVR-4)</text><path d='M566.40,91.20 L1065.60,91.20 L1065.60,143.27 L566.40,143.27 Z' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='816.00' y='115.05' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#101010' text-anchor='middle' font-weight='600'>Mabat::builder().register::&lt;TaskView&gt;()…build(&amp;mut conn)</text><text xml:space='preserve' x='816.00' y='128.22' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>for every query of every view, generated or overridden</text><path d='M566.40,186.47 L1065.60,186.47 L1065.60,239.87 L566.40,239.87 Z' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='816.00' y='211.39' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>prepare, without running</text><text xml:space='preserve' x='816.00' y='224.81' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>the database parses the SQL and describes its columns and parameters</text><path d='M566.40,283.07 L1065.60,283.07 L1065.60,336.47 L566.40,336.47 Z' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='816.00' y='307.99' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>compare with the view</text><text xml:space='preserve' x='816.00' y='321.41' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>every alias the view decodes, with a compatible type; the keys as the only parameter</text><polyline points='816.00,143.27 816.00,186.47' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /><polyline points='816.00,239.87 816.00,283.07' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /><text xml:space='preserve' x='570.72' y='380.22' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.20' fill='#14181D' text-anchor='start' font-weight='600'>diagnostics, each with the view, the query, the file and the line</text><rect x='566.40' y='395.99' width='499.20' height='112.92' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='582.24' y='417.56' font-family="Consolas, Menlo, monospace" font-size='10.13' fill='#14181D' text-anchor='start'>M0100  the file cannot be read or parsed</text><text xml:space='preserve' x='582.24' y='430.13' font-family="Consolas, Menlo, monospace" font-size='10.13' fill='#14181D' text-anchor='start'>M0101  no such view, or no such query</text><text xml:space='preserve' x='582.24' y='442.69' font-family="Consolas, Menlo, monospace" font-size='10.13' fill='#14181D' text-anchor='start'>M0102  missing, extra or wrongly typed aliases</text><text xml:space='preserve' x='582.24' y='455.26' font-family="Consolas, Menlo, monospace" font-size='10.13' fill='#14181D' text-anchor='start'>M0103  the query does not prepare</text><text xml:space='preserve' x='582.24' y='467.82' font-family="Consolas, Menlo, monospace" font-size='10.13' fill='#14181D' text-anchor='start'>M0104  the wrong parameters</text><text xml:space='preserve' x='582.24' y='480.39' font-family="Consolas, Menlo, monospace" font-size='10.13' fill='#14181D' text-anchor='start'>M0105  warning: an optional path is never selected</text><text xml:space='preserve' x='582.24' y='492.95' font-family="Consolas, Menlo, monospace" font-size='10.13' fill='#14181D' text-anchor='start'>M0301  the view cannot be planned</text><path d='M566.40,537.71 L1065.60,537.71 L1065.60,604.00 L566.40,604.00 Z' fill='#FDECEC' stroke='#C0392B' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='816.00' y='562.62' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>errors stop the build</text><text xml:space='preserve' x='816.00' y='576.04' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#8C2F22' text-anchor='middle'>Error::Invalid with the report, or on_invalid(UseGenerated) runs the generated query instead</text><text xml:space='preserve' x='816.00' y='588.94' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#8C2F22' text-anchor='middle'>(MPA-OVR-5)</text><polyline points='523.20,148.80 566.40,148.80' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /><path d='M1108.80,91.20 L1608.00,91.20 L1608.00,157.49 L1108.80,157.49 Z' fill='#DFEFD4' stroke='#4B8B2B' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1358.40' y='116.11' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>the registry</text><text xml:space='preserve' x='1358.40' y='129.54' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>immutable; Mabat::load::&lt;TaskView&gt;() runs the override where there is one, the generated</text><text xml:space='preserve' x='1358.40' y='142.43' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>query elsewhere (MPA-OVR-1)</text><polyline points='1065.60,134.40 1108.80,134.40' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /><rect x='1108.80' y='191.09' width='499.20' height='61.13' rx='5.76' fill='#DFEFD4' stroke='#4B8B2B' stroke-width='1.15'/><text xml:space='preserve' x='1113.12' y='206.84' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='start' font-weight='600'>shadow = true</text><text xml:space='preserve' x='1113.12' y='219.87' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>runs the override and the generated query, and logs a warning when their rows differ;</text><text xml:space='preserve' x='1113.12' y='232.43' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>shadow_stats counts runs and mismatches (MPA-OVR-6)</text><rect x='1108.80' y='269.50' width='499.20' height='61.13' rx='5.76' fill='#DFEFD4' stroke='#4B8B2B' stroke-width='1.15'/><text xml:space='preserve' x='1113.12' y='285.25' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='start' font-weight='600'>reload(&amp;mut conn)</text><text xml:space='preserve' x='1113.12' y='298.28' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>reads the files again, checks them, and swaps them in atomically; invalid files leave the</text><text xml:space='preserve' x='1113.12' y='310.84' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>running overrides as they are (MPA-OVR-7)</text><rect x='1108.80' y='347.91' width='499.20' height='48.57' rx='5.76' fill='#FCE3CD' stroke='#C0651A' stroke-width='1.15'/><text xml:space='preserve' x='1113.12' y='363.66' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='start' font-weight='600'>nested arguments and paging</text><text xml:space='preserve' x='1113.12' y='376.69' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>wrap the override as a subquery and refer to columns by their aliases (MPA-LOAD-10)</text><rect x='1108.80' y='413.76' width='499.20' height='48.57' rx='5.76' fill='#F6F7F9' stroke='#5B6472' stroke-width='1.15'/><text xml:space='preserve' x='1113.12' y='429.50' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='start' font-weight='600'>writes never use overrides</text><text xml:space='preserve' x='1113.12' y='442.53' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>save and delete always run generated statements (MPA-NOT-5)</text><rect x='24.00' y='647.20' width='1584.00' height='129.60' rx='13.44' fill='#FCFDFE' stroke='#A9B2BD' stroke-width='0.86' stroke-dasharray='6 4'/><text xml:space='preserve' x='45.60' y='676.09' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.67' fill='#5A646F' text-anchor='start' font-weight='600'>without a Rust toolchain: the mabat command line tool (MPA-OVR-8)</text><path d='M48.00,690.40 L403.20,690.40 L403.20,759.52 L48.00,759.52 Z' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='225.60' y='723.21' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.73' fill='#101010' text-anchor='middle' font-weight='600'>Builder::manifest()</text><text xml:space='preserve' x='225.60' y='735.91' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>the application writes its views as JSON</text><path d='M436.80,690.40 L792.00,690.40 L792.00,759.52 L436.80,759.52 Z' fill='#DFEFD4' stroke='#4B8B2B' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='614.40' y='717.09' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.73' fill='#101010' text-anchor='middle' font-weight='600'>mabat check</text><text xml:space='preserve' x='614.40' y='729.79' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>the override files against the manifest and a database; --schema</text><text xml:space='preserve' x='614.40' y='742.02' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>makes a scratch schema</text><path d='M825.60,690.40 L1180.80,690.40 L1180.80,759.52 L825.60,759.52 Z' fill='#DFEFD4' stroke='#4B8B2B' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1003.20' y='723.21' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.73' fill='#101010' text-anchor='middle' font-weight='600'>mabat explain</text><text xml:space='preserve' x='1003.20' y='735.91' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>every query of a view, generated or overridden</text><path d='M1214.40,690.40 L1569.60,690.40 L1569.60,759.52 L1214.40,759.52 Z' fill='#DFEFD4' stroke='#4B8B2B' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1392.00' y='723.21' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.73' fill='#101010' text-anchor='middle' font-weight='600'>mabat scaffold</text><text xml:space='preserve' x='1392.00' y='735.91' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#3D4650' text-anchor='middle'>an override file from the generated SQL, to edit</text><polyline points='403.20,724.96 436.80,724.96' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /><polyline points='792.00,724.96 825.60,724.96' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /><polyline points='1180.80,724.96 1214.40,724.96' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /></svg>