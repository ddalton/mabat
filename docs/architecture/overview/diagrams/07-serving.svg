<svg xmlns='http://www.w3.org/2000/svg' width='1637' height='596' viewBox='0 0 1637 596'><defs><marker id='ah-2E6FB7' markerWidth='8' markerHeight='6' refX='7.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#2E6FB7'/></marker><marker id='ahs-2E6FB7' markerWidth='8' markerHeight='6' refX='0.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M8,0 L0,3 L8,6 z' fill='#2E6FB7'/></marker><marker id='ah-4B8B2B' markerWidth='8' markerHeight='6' refX='7.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#4B8B2B'/></marker><marker id='ahs-4B8B2B' markerWidth='8' markerHeight='6' refX='0.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M8,0 L0,3 L8,6 z' fill='#4B8B2B'/></marker></defs><rect x='0' y='0' width='1636.9' height='596.4' fill='#FFFFFF'/><rect x='24.00' y='28.80' width='369.60' height='38.40' rx='4.80' fill='#2E6FB7' stroke='#2E6FB7' stroke-width='1.00'/><text xml:space='preserve' x='208.80' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>a request</text><rect x='428.83' y='28.80' width='369.60' height='38.40' rx='4.80' fill='#17847A' stroke='#17847A' stroke-width='1.00'/><text xml:space='preserve' x='613.63' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>a selection</text><rect x='833.66' y='28.80' width='369.60' height='38.40' rx='4.80' fill='#17847A' stroke='#17847A' stroke-width='1.00'/><text xml:space='preserve' x='1018.46' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>the selected plan</text><rect x='1238.50' y='28.80' width='369.60' height='38.40' rx='4.80' fill='#C0651A' stroke='#C0651A' stroke-width='1.00'/><text xml:space='preserve' x='1423.30' y='52.96' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#FFFFFF' text-anchor='middle' font-weight='600'>JSON</text><rect x='24.00' y='91.20' width='369.60' height='148.63' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='39.84' y='111.71' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>query {</text><text xml:space='preserve' x='39.84' y='122.96' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>  tasks(where: { name: { ilike: "%release%" } },</text><text xml:space='preserve' x='39.84' y='134.20' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>        limit: 20) {</text><text xml:space='preserve' x='39.84' y='145.44' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>    name</text><text xml:space='preserve' x='39.84' y='156.68' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>    assignee { name }</text><text xml:space='preserve' x='39.84' y='167.93' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>    notes(orderBy: [{ createdAt: DESC }],</text><text xml:space='preserve' x='39.84' y='179.17' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>          limit: 3) {</text><text xml:space='preserve' x='39.84' y='190.41' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>      body</text><text xml:space='preserve' x='39.84' y='201.66' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>    }</text><text xml:space='preserve' x='39.84' y='212.90' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>  }</text><text xml:space='preserve' x='39.84' y='224.14' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>}</text><path d='M428.83,91.20 L798.43,91.20 L798.43,239.83 L428.83,239.83 Z' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='613.63' y='131.49' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>the selection set, as a Selection</text><text xml:space='preserve' x='613.63' y='144.91' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>fields: name, assignee { name }, notes { body }</text><text xml:space='preserve' x='613.63' y='170.71' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>arguments: the root's where and limit; nested arguments for notes,</text><text xml:space='preserve' x='613.63' y='183.60' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>by its path (MPA-GQL-4, MPA-LOAD-9)</text><text xml:space='preserve' x='613.63' y='209.39' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>fragments resolved, variables applied</text><path d='M833.66,91.20 L1203.26,91.20 L1203.26,239.83 L833.66,239.83 Z' fill='#D6F0EC' stroke='#17847A' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1018.46' y='137.94' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>build_selected</text><text xml:space='preserve' x='1018.46' y='151.36' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>only the selected columns, and only the selected child queries:</text><text xml:space='preserve' x='1018.46' y='164.26' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>three queries, not five</text><text xml:space='preserve' x='1018.46' y='190.05' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>recursion unrolled to the depth the selection asks for (MPA-JSON-3,</text><text xml:space='preserve' x='1018.46' y='202.95' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>MPA-JSON-5)</text><rect x='1238.50' y='91.20' width='369.60' height='148.63' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='1254.34' y='111.71' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>[{</text><text xml:space='preserve' x='1254.34' y='122.96' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>  "name": "Release 1.2",</text><text xml:space='preserve' x='1254.34' y='134.20' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>  "assignee": { "name": "Ada" },</text><text xml:space='preserve' x='1254.34' y='145.44' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>  "notes": [</text><text xml:space='preserve' x='1254.34' y='156.68' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>    { "body": "Tagged" },</text><text xml:space='preserve' x='1254.34' y='167.93' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>    { "body": "Notes drafted" },</text><text xml:space='preserve' x='1254.34' y='179.17' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>    { "body": "Branch cut" }</text><text xml:space='preserve' x='1254.34' y='190.41' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>  ]</text><text xml:space='preserve' x='1254.34' y='201.66' font-family="Consolas, Menlo, monospace" font-size='9.07' fill='#14181D' text-anchor='start'>}]</text><polyline points='393.60,139.20 428.83,139.20' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /><polyline points='798.43,139.20 833.66,139.20' fill='none' stroke='#4B8B2B' stroke-width='1.34' marker-end='url(#ah-4B8B2B)' /><polyline points='1203.26,139.20 1238.50,139.20' fill='none' stroke='#2E6FB7' stroke-width='1.34' marker-end='url(#ah-2E6FB7)' /><text xml:space='preserve' x='28.32' y='308.90' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#17847A' text-anchor='start' font-weight='600'>notes(limit: 3) is per task, in the notes query: ROW_NUMBER() OVER (PARTITION BY the parent)</text><rect x='24.00' y='326.23' width='825.60' height='120.19' rx='4.80' fill='#F7F8FB' stroke='#D5DBE3' stroke-width='0.77'/><text xml:space='preserve' x='39.84' y='347.27' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>SELECT * FROM (</text><text xml:space='preserve' x='39.84' y='359.18' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>  SELECT t0."id" AS "id", t0."task_id" AS "$parent",</text><text xml:space='preserve' x='39.84' y='371.08' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>         t0."body" AS "body",</text><text xml:space='preserve' x='39.84' y='382.98' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>         ROW_NUMBER() OVER (PARTITION BY t0."task_id"</text><text xml:space='preserve' x='39.84' y='394.89' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>           ORDER BY t0."created_at" DESC, t0."id") AS "$row"</text><text xml:space='preserve' x='39.84' y='406.79' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>  FROM "note" AS t0</text><text xml:space='preserve' x='39.84' y='418.70' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>  WHERE t0."task_id" = ANY($1)</text><text xml:space='preserve' x='39.84' y='430.60' font-family="Consolas, Menlo, monospace" font-size='9.60' fill='#14181D' text-anchor='start'>) AS p WHERE p."$row" &lt;= 3 ORDER BY p."$row"</text><rect x='883.20' y='326.23' width='724.80' height='61.13' rx='5.76' fill='#E6DBF6' stroke='#6F45B5' stroke-width='1.15'/><text xml:space='preserve' x='887.52' y='341.97' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='start' font-weight='600'>the schema is generated from the views</text><text xml:space='preserve' x='887.52' y='355.00' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>mabat_graphql::schema(&amp;pool).list::&lt;TaskView&gt;("tasks").by_key::&lt;TaskView&gt;("task"): objects for views, unions for enums with data, filters</text><text xml:space='preserve' x='887.52' y='367.57' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>from the column types (MPA-GQL-1, MPA-GQL-2)</text><rect x='883.20' y='398.88' width='724.80' height='48.57' rx='5.76' fill='#E8F5EC' stroke='#2F7D4A' stroke-width='1.15'/><text xml:space='preserve' x='887.52' y='414.62' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='start' font-weight='600'>one load per root field</text><text xml:space='preserve' x='887.52' y='427.65' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>the whole selection set, every level batched: no resolver per field, so no N+1 (MPA-GQL-4)</text><rect x='883.20' y='458.97' width='724.80' height='48.57' rx='5.76' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='1.15'/><text xml:space='preserve' x='887.52' y='474.71' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='start' font-weight='600'>the same, without GraphQL</text><text xml:space='preserve' x='887.52' y='487.74' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>load::&lt;TaskView&gt;().select(Selection::parse("name assignee { name }")).json(conn): for a REST endpoint (MPA-JSON-3)</text><rect x='883.20' y='519.05' width='724.80' height='48.57' rx='5.76' fill='#DFEFD4' stroke='#4B8B2B' stroke-width='1.15'/><text xml:space='preserve' x='887.52' y='534.79' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.00' fill='#101010' text-anchor='start' font-weight='600'>overrides apply</text><text xml:space='preserve' x='887.52' y='547.82' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#333333' text-anchor='start'>a registry's overrides serve selections and GraphQL too (MPA-JSON-6)</text></svg>