[package]
name = "mabat-cli"
description = "Check, explain and scaffold Mabat override SQL without the application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
keywords = ["sql", "postgres", "cli", "views"]
categories = ["command-line-utilities", "database"]
readme = "README.md"
# The tests use the fixture of the mabat crate, outside this package
exclude = ["tests/"]

[[bin]]
name = "mabat"
path = "src/main.rs"

[features]
default = ["mysql", "postgres", "sqlite"]
postgres = ["mabat-sqlx/postgres"]
mysql = ["mabat-sqlx/mysql"]
sqlite = ["mabat-sqlx/sqlite"]

[dependencies]
mabat-sqlx.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
chrono.workspace = true
mabat = { workspace = true, features = ["postgres"] }
mabat-e2e.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v4"] }
