[package]
name = "refract-cli"
description = "Check, explain and scaffold Refract override SQL without the application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "refract"
path = "src/main.rs"

[dependencies]
refract-sqlx.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
chrono.workspace = true
refract.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v4"] }
