[package]
name = "mabat"
description = "Typed aggregate reads for Rust, with SQL you can tune without changing code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
keywords = ["sql", "postgres", "sqlx", "orm", "views"]
categories = ["database", "asynchronous"]
readme = "../../README.md"

[features]
default = ["postgres"]
postgres = ["mabat-sqlx/postgres"]
mysql = ["mabat-sqlx/mysql"]
sqlite = ["mabat-sqlx/sqlite"]

[dependencies]
mabat-core.workspace = true
mabat-derive.workspace = true
mabat-sqlx.workspace = true

[dev-dependencies]
chrono.workspace = true
serde.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["time"] }
trybuild.workspace = true
uuid = { workspace = true, features = ["v4"] }

# The tests and the example run on PostgreSQL, except the SQLite tests

[[test]]
name = "collections"
required-features = ["postgres"]

[[test]]
name = "filters"
required-features = ["postgres"]

[[test]]
name = "graphs"
required-features = ["postgres"]

[[test]]
name = "load"
required-features = ["postgres"]

[[test]]
name = "manifest"
required-features = ["postgres"]

[[test]]
name = "overrides"
required-features = ["postgres"]

[[test]]
name = "pooled"
required-features = ["postgres"]

[[test]]
name = "sums"
required-features = ["postgres"]

[[example]]
name = "parity"
required-features = ["postgres"]
