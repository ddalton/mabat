[package]
name = "mabat"
description = "An aggregate mapper for Rust: declare the shape of a domain aggregate, and load and save it with batched, checkable SQL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
keywords = ["orm", "sqlx", "postgres", "aggregate", "ddd"]
categories = ["database", "asynchronous"]
readme = "../../README.md"
# The spec consistency test reads docs/ at the repository root
exclude = ["tests/mpa.rs"]

[features]
default = ["postgres"]
postgres = ["mabat-sqlx/postgres"]
mysql = ["mabat-sqlx/mysql"]
sqlite = ["mabat-sqlx/sqlite"]

[dependencies]
mabat-core.workspace = true
mabat-derive.workspace = true
mabat-sqlx.workspace = true

[dev-dependencies]
chrono = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["time"] }
trybuild.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }

# The tests and the example run on PostgreSQL, except the SQLite tests

[[test]]
name = "collections"
required-features = ["postgres"]

[[test]]
name = "filters"
required-features = ["postgres"]

[[test]]
name = "graphs"
required-features = ["postgres"]

[[test]]
name = "load"
required-features = ["postgres"]

[[test]]
name = "manifest"
required-features = ["postgres"]

[[test]]
name = "overrides"
required-features = ["postgres"]

[[test]]
name = "json"
required-features = ["postgres"]

[[test]]
name = "nested"
required-features = ["postgres"]

[[test]]
name = "pooled"
required-features = ["postgres"]

[[test]]
name = "save"
required-features = ["postgres"]

[[test]]
name = "sums"
required-features = ["postgres"]

[[example]]
name = "parity"
required-features = ["postgres"]

[[example]]
name = "save_all"
required-features = ["postgres"]

[package.metadata.docs.rs]
# Document every database's API, not only the default PostgreSQL one
all-features = true
